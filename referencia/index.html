<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chamados — laboratório</title>
<style>body{font:18px/1.5 system-ui;max-width:900px;margin:40px auto;padding:0 24px;color:#172b3a;background:#f7f8fa}fieldset{margin:20px 0;border:1px solid #bcc7ce}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:7px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #bcc7ce;text-align:left;padding:8px}#aviso{min-height:2em;color:#813000}</style>
<h1>Chamados</h1><p>Dados fictícios em memória. Recarregar restaura o estado inicial.</p>
<form id="cadastro"><fieldset><legend>Novo chamado</legend><label>Título <input id="titulo"></label><label>Descrição <input id="descricao"></label><button>Cadastrar</button></fieldset></form>
<fieldset><legend>Filtrar</legend><label>Status <select id="status"><option value="">Todos</option><option>aberto</option><option>em-andamento</option><option>concluido</option></select></label><label>Prioridade <select id="prioridade"><option value="">Todas</option><option>baixa</option><option>normal</option><option>alta</option></select></label><button id="filtrar">Aplicar</button></fieldset>
<form id="alteracao"><fieldset><legend>Atualizar chamado</legend><label>Identificador <input id="identificador" placeholder="CH-001"></label><label>Status <select id="novo-status"><option>aberto</option><option>em-andamento</option><option>concluido</option></select></label><label>Prioridade <select id="nova-prioridade"><option>baixa</option><option selected>normal</option><option>alta</option></select></label><button>Atualizar</button></fieldset></form>
<p id="aviso" role="status"></p><table><thead><tr><th>ID</th><th>Título</th><th>Status</th><th>Prioridade</th></tr></thead><tbody id="lista"></tbody></table>
<script src="chamados.cjs"></script><script>
const dados=[{id:"CH-001",titulo:"Impressora sem papel",descricao:"Dados fictícios.",status:"aberto",prioridade:"alta"},{id:"CH-002",titulo:"Acesso restabelecido",descricao:"Dados fictícios.",status:"concluido",prioridade:"normal"},{id:"CH-003",titulo:"Atualizar cadastro",descricao:"Dados fictícios.",status:"aberto",prioridade:"normal"}];
const servico=Chamados.criarServico(dados),campo=id=>document.getElementById(id);
function mostrar(){const filtros={};if(campo("status").value)filtros.status=campo("status").value;if(campo("prioridade").value)filtros.prioridade=campo("prioridade").value;const itens=servico.listar(filtros);campo("lista").replaceChildren();for(const item of itens){const linha=document.createElement("tr");for(const chave of ["id","titulo","status","prioridade"]){const celula=document.createElement("td");celula.textContent=item[chave];linha.append(celula);}campo("lista").append(linha);}if(!itens.length)campo("aviso").textContent="Nenhum chamado corresponde aos filtros.";}
function executar(acao){campo("aviso").textContent="";try{acao();mostrar();}catch(erro){campo("aviso").textContent=erro.message;}}
campo("cadastro").onsubmit=e=>{e.preventDefault();executar(()=>{servico.criar(campo("titulo").value,campo("descricao").value);campo("titulo").value="";campo("descricao").value="";});};
campo("alteracao").onsubmit=e=>{e.preventDefault();executar(()=>servico.atualizar(campo("identificador").value,campo("novo-status").value,campo("nova-prioridade").value));};
campo("filtrar").onclick=()=>executar(()=>{});mostrar();
</script></html>
